name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff (blocking syntax/undefined names)
        run: python -m ruff check stegoguard tests run_tests.py
      - name: Compile
        run: python -m compileall -q stegoguard
      - name: Mypy (informational)
        continue-on-error: true
        run: python -m mypy stegoguard
      - name: Tests
        run: python run_tests.py
