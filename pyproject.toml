[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegoguard"
version = "2.0.0"
description = "Автономный комплекс локального анализа стеганографических рисков файлов для закрытых промышленных контуров"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "Pillow>=9.0", "matplotlib>=3.5", "pypdf>=4.0", "customtkinter>=5.2"]

[project.scripts]
stegoguard = "stegoguard.cli:main"

[tool.setuptools]
packages = ["stegoguard", "stegoguard.analysis"]
